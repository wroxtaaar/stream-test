services:
  webtorrent-demo:
    build:
      context: .
    platform: linux/arm64
    init: true
    restart: "no"
    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"
    ports:
      - "127.0.0.1:18080:3000"
    volumes:
      - ./data:/data
    environment:
      PORT: "3000"
      DATA_DIR: /data
      METADATA_TIMEOUT_MS: "90000"
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128

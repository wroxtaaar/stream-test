services:
  nuvio-streams:
    build:
      context: .
      dockerfile: Dockerfile
    image: stream-test-nuvio-streams:latest
    container_name: stream-test-nuvio-streams
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "7000"
      NODE_ENV: production
    ports:
      - "${NUVIO_HOST_PORT:-17000}:7000"
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

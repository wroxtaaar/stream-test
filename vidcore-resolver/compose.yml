services:
  vidcore-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-test-vidcore-resolver
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      VIDCORE_ORIGIN: ${VIDCORE_ORIGIN:-https://vidcore.io}
    ports:
      - "${VIDCORE_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

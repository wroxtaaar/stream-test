services:
  vidcore-resolver:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidcore-resolver-test:local
    container_name: vidcore-resolver-test
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:18084:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

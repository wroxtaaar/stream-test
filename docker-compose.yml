services:
  stream-test:
    build: .
    container_name: stream-test
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  rapidbay:
    image: hauxir/rapidbay:latest
    container_name: rapidbay
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PASSWORD: ${RAPIDBAY_PASSWORD:?Set RAPIDBAY_PASSWORD in .env}
      JACKETT_HOST: ${JACKETT_HOST:-}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      PROWLARR_HOST: ${PROWLARR_HOST:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}

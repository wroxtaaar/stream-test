services:
  stream-test:
    build: .
    container_name: stream-test
    restart: unless-stopped
    environment:
      PORT: "10080"
    ports:
      - "10080:10080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
